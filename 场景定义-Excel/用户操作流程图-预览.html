<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>场景定义 · 用户操作流程图</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; background: #f5f7fb; margin: 0; padding: 24px; }
    h1 { font-size: 20px; color: #1f2937; }
    p { color: #667085; font-size: 13px; }
    .grid { display: grid; gap: 24px; max-width: 1200px; }
    figure { background: #fff; border: 1px solid #e8e8e8; border-radius: 10px; padding: 16px; margin: 0; }
    figure img { max-width: 100%; height: auto; display: block; cursor: pointer; border: 1px solid #f0f0f0; }
    figcaption { margin-top: 10px; font-size: 14px; font-weight: 600; color: #344054; }
    .tip { background: #e6f7ff; border: 1px solid #91d5ff; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>场景定义 · 用户操作流程图（PNG）</h1>
  <p>来源：Sheet4-用户操作逻辑.csv · 点击图片可全屏查看，右键复制图片</p>
  <div class="tip">💡 在图片上 <strong>右键 → 复制图像</strong>，即可粘贴到 Word / PPT / 飞书文档</div>
  <div class="grid">
    <figure><img src="flows/00-overview.png" alt="总览" onclick="window.open(this.src)" /><figcaption>00 · 总览 · 四条用户路径</figcaption></figure>
    <figure><img src="flows/A-preset.png" alt="路径A" onclick="window.open(this.src)" /><figcaption>A · 浏览与选用预置场景</figcaption></figure>
    <figure><img src="flows/B-create.png" alt="路径B" onclick="window.open(this.src)" /><figcaption>B · 创建自定义场景</figcaption></figure>
    <figure><img src="flows/C-manage.png" alt="路径C" onclick="window.open(this.src)" /><figcaption>C · 管理已有自定义场景</figcaption></figure>
    <figure><img src="flows/D-newflow.png" alt="路径D" onclick="window.open(this.src)" /><figcaption>D · 从新建流程选用场景</figcaption></figure>
    <figure><img src="flows/E-states.png" alt="状态机" onclick="window.open(this.src)" /><figcaption>E · 状态机总图</figcaption></figure>
  </div>
</body>
</html>
